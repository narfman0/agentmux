[package]
name = "agentmux-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
bytes = "1"
bincode = { version = "2", features = ["serde"] }
thiserror = "1"
directories = "5"
anyhow = "1"
futures = "0.3"

tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
